<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07101d" />
    <title>VIX Pulse — VIX response and asset recovery analytics</title>
    <meta
      name="description"
      content="Measure how stocks, ETFs and ETCs respond to VIX peaks above 25 with recovery charts, sensitivity rankings, weekly moving averages, and profit/loss statistics."
    />
    <meta name="author" content="VIX Pulse" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VIX Pulse — VIX response and asset recovery analytics" />
    <meta
      property="og:description"
      content="Weekly VIX response charts, asset sensitivity rankings, recovery statistics, and the current volatility regime — all client-side."
    />
    <meta property="og:site_name" content="VIX Pulse" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VIX Pulse" />
    <meta
      name="twitter:description"
      content="Weekly VIX response charts, sensitivity rankings, recovery statistics, and the current volatility regime."
    />
    <script>
      try {
        var theme = localStorage.getItem('vix-pulse-theme')
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>VIX Pulse requires JavaScript to display the interactive charts.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
