name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  schedule:
    # Refresh after the US market close on weekdays.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      refresh_market_data:
        description: Download and publish the latest VIX and asset quotes before deployment
        required: false
        type: boolean
        default: true
      asset_yahoo_ticker:
        description: Optional Yahoo Finance ticker to add to the public catalog (for example RHM.DE)
        required: false
        type: string
        default: ''
      asset_display_ticker:
        description: Optional ticker label shown in VIX Pulse
        required: false
        type: string
        default: ''
      asset_name:
        description: Optional full asset name
        required: false
        type: string
        default: ''
      asset_isin:
        description: Optional ISIN (a local custom ID is generated if blank)
        required: false
        type: string
        default: ''
      asset_type:
        description: Asset type
        required: false
        type: choice
        options:
          - stock
          - etf
          - etc
          - adr
          - index
        default: stock
      asset_currency:
        description: Three-letter price currency, such as USD, EUR, or GBP
        required: false
        type: string
        default: USD
      asset_exchange:
        description: Exchange label shown in VIX Pulse
        required: false
        type: string
        default: Yahoo Finance
      asset_price_divisor:
        description: Divide Yahoo prices by this value (use 100 for pence quoted as GBP)
        required: false
        type: string
        default: '1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  refresh-data:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_market_data || inputs.asset_yahoo_ticker != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - name: Install data dependencies
        run: pip install -r scripts/requirements.txt
      - name: Test Yahoo asset registry
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Register requested Yahoo asset
        if: github.event_name == 'workflow_dispatch' && inputs.asset_yahoo_ticker != ''
        run: python scripts/add_custom_asset.py
        env:
          ASSET_YAHOO_TICKER: ${{ inputs.asset_yahoo_ticker }}
          ASSET_DISPLAY_TICKER: ${{ inputs.asset_display_ticker }}
          ASSET_NAME: ${{ inputs.asset_name }}
          ASSET_ISIN: ${{ inputs.asset_isin }}
          ASSET_TYPE: ${{ inputs.asset_type }}
          ASSET_CURRENCY: ${{ inputs.asset_currency }}
          ASSET_EXCHANGE: ${{ inputs.asset_exchange }}
          ASSET_PRICE_DIVISOR: ${{ inputs.asset_price_divisor }}
      - name: Download and validate market data
        run: python scripts/fetch_data.py
        env:
          VIX_PULSE_FAIL_ON_PLACEHOLDER: '1'
      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/vix-pulse.json scripts/custom_assets.json
          if git diff --cached --quiet; then
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh market data"
            git push origin HEAD:main
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: refresh-data
    if: always() && (needs.refresh-data.result == 'success' || needs.refresh-data.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh-data.outputs.commit || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm run test:run
      - name: Build
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: ${{ always() && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
